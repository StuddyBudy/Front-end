<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyBuddy</title>
    <link href="/style.css" rel="stylesheet" />
    <script defer src="/theme.js"></script>
  </head>
  <body class="bg-zinc-100 dark:bg-zinc-700 dark:text-zinc-100">
    <nav class="flex justify-between w-full shadow hidden sm:flex sticky mb-2">
      <a class="hover:bg-zinc-200 p-2 rounded dark:hover:bg-zinc-600" href="/"
        >Home</a
      >

      <div class="flex justify-around gap-x-2">
        <a
          class="hover:bg-zinc-200 p-2 rounded dark:hover:bg-zinc-600"
          href="/GPA_calc/step1.html"
          >GPA</a
        >
        <a
          class="hover:bg-zinc-200 p-2 rounded dark:hover:bg-zinc-600"
          href="/todo"
          >Todo</a
        >
        <a
          class="hover:bg-zinc-200 p-2 rounded dark:hover:bg-zinc-600"
          href="/pass"
          >Passwords</a
        >

        <select
          id="theme-toggle"
          class="p-2 hover:bg-zinc-200 rounded dark:hover:bg-zinc-600 text-center"
        >
          <option value="dark">dark</option>
          <option value="light">light</option>
          <option value="system">system</option>
        </select>
      </div>
    </nav>

    <nav
      class="sm:hidden flex flex-col gap-2 h-full absolute bg-zinc-100 border-r-4 dark:bg-zinc-700"
    >
      <a class="hover:bg-zinc-200 border p-2 rounded" href="/">Home</a>
      <a class="hover:bg-zinc-200 border p-2 rounded" href="/gpa">GPA</a>
      <a class="hover:bg-zinc-200 border p-2 rounded" href="/todo">Todo</a>
      <a class="hover:bg-zinc-200 border p-2 rounded" href="/pass">Passwords</a>
    </nav>
    <h1 class="text-4xl font-bold text-center">StudyBuddy</h1>
  </body>
</html>
