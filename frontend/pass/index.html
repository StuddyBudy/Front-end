<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link href="/style.css" rel="stylesheet" />
    <script defer src="/theme.js"></script>
    <script defer src="pass.js"></script>
    <link rel="shortcut icon" href="/favicon.svg" type="image/x-icon" />
  </head>
  <body class="bg-zinc-100 dark:bg-zinc-700 dark:text-zinc-100">
    <nav class="flex justify-between w-full shadow hidden sm:flex sticky mb-2">
      <a class="hover:bg-zinc-200 p-2 rounded dark:hover:bg-zinc-600" href="/"
        >Home</a
      >

      <div class="flex justify-around gap-x-2">
        <a
          class="hover:bg-zinc-200 p-2 rounded dark:hover:bg-zinc-600"
          href="/gpa"
          >GPA</a
        >

        <a
          class="hover:bg-zinc-200 p-2 rounded dark:hover:bg-zinc-600"
          href="/todo"
          >Todo</a
        >
        <a
          class="hover:bg-zinc-200 p-2 rounded dark:hover:bg-zinc-600"
          href="/pass"
          >Passwords</a
        >

        <select
          id="theme-toggle"
          class="p-2 hover:bg-zinc-200 rounded dark:hover:bg-zinc-600 text-center"
        >
          <option value="dark">dark</option>
          <option value="light">light</option>
          <option value="system">system</option>
        </select>
      </div>
    </nav>

    <nav
      class="sm:hidden flex flex-col gap-2 h-full absolute bg-zinc-100 border-r-4 dark:bg-zinc-700"
    >
      <a class="hover:bg-zinc-200 border p-2 rounded" href="/">Home</a>
      <a class="hover:bg-zinc-200 border p-2 rounded" href="/gpa">GPA</a>
      <a class="hover:bg-zinc-200 border p-2 rounded" href="/todo">Todo</a>
      <a class="hover:bg-zinc-200 border p-2 rounded" href="/pass">Passwords</a>
    </nav>

    <div class="mx-auto rounded border w-fit flex flex-col p-4 m-2 gap-2">
      <h1 class="text-center text-5xl font-bold">Password Generator</h1>

      <div class="input flex flex-col text-center">
        <label>
          Password Length:
          <input type="number" id="length" min="1" max="50" value="15" />
        </label>

        <label>
          Include Uppercase Letters:
          <input type="checkbox" id="includeUppercase" checked />
        </label>

        <label>
          Include Numbers:
          <input type="checkbox" id="includeNumbers" checked />
        </label>

        <label>
          Include Symbols:
          <input type="checkbox" id="includeSymbols" checked />
        </label>
      </div>

      <button class="rounded border w-fit mx-auto p-2" id="generate">
        Generate Password
      </button>

      <label class="h-fit mx-auto">
        Password:
        <span id="password" class="break-all"></span>
      </label>

      <p id="text" class="hidden rounded text-center h-fit mx-auto p-2">
        Great Password
      </p>
      <img
        class="w-128 mx-auto rounded"
        alt="Description of how longer passwords take much longer times to break"
        src="./pass_pics/pass.webp"
      />
    </div>
  </body>
</html>
