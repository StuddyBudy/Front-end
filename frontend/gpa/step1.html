<body>

 <header>
  <div class="title">
     <h1 style="font-size: 42.5px; font-family: Georgia ;"> GPA Calculator </h1>
     <h5> (Editing classes)  </h5>
  </div>
</header>


<hr><br><br>

<!--- Top area buttons -->
<!-- mp buttons -->
 <div class="parent">
    
        <button class="bg-button hover:brightness-80 butt mp1" id="mp1" onclick="mpButts(1)"> mp1</button>
        <button class="bg-button hover:brightness-80 butt mp2" id="mp2" onclick="mpButts(2)"> mp2</button>
        <button class="bg-button hover:brightness-80 butt mp3" id="mp3" onclick="mpButts(3)"> mp3</button>
        <button class="bg-button hover:brightness-80 butt mp4" id="mp4" onclick="mpButts(4)"> mp4</button>
    
</div>
<br>



<!-- add class button -->
<div id="options">
    <button class="hover:brightness-80 border" id="add_class" onclick="unhide2(); valueReset();"> Add Class </button>
    <br><br>

    <!-- class num and max num -->
    <p id="class_num">0 out of 8 classes used </p>

    <br>

    <h2 id="max_classes" style="display:none"> You have reached the Maximum amount of classes allowed! </h2>

    <h2 id="errorMessage">  </h2>

    <!-- Clear data/storage buttons -->
    <button class="hover:brightness-80 border" id="reset_data" onclick="clearLocalStorage()"> Reset Data </button>
    <br>

</div>

<br>
<p id="mpSel" style="display: none;"> You are now editing mp </p>

<br> <hr>

<!-- Input Fields -->
<div class="container">
    <div class="inputs">
        <div id="input_id"> 

            <!-- subject input -->
             
            <div id="subject_id" style="display:none"> 

                <label for="subject"> Subject: </label>
                <br>
                <select name="subject" id="subject">
                    <option value="" disabled selected> Select your subject: </option>  
                </select>
                <br>
            </div>

            <!-- Elective input -->

            <div id="elective_id" style = "display: none"> 

                <label for="elective"> Electives: </label> 
                <br>
                <select name="elective" id="elective">
                    <option value="" disabled selected> Select your elective: </option>          
                </select>
                <br>
            </div>

            <!-- langauge dropdown menu -->

            <div id="language_id" style = "display: none "> 

                <label for="language"> Langauges: </label> 
                <br>
                <select name="language" id="language">
                    <option value="" disabled selected> Select your language: </option>
                </select>
                <br>
            </div>
           

            <!-- Course Level input -->

            <div id="course_lv_id" style = "display: none"> 

                <label for="course_lv"> Course Lv: </label> 
                <br>
                <select name="course_lv" id="course_lv">
                    <option value="start" disabled selected> Select the course level: </option> 
                </select>
                <br>
            </div>

            


            <!-- Course length  -->

            <div id="course_length_id" style = "display: none"> 

                <label for="course_length"> Course Length: </label> 
                <br>
                <select name="course_length" id="course_length">

                    <option value="start" disabled selected> Select the course length: </option> 
                </select>
                <br>
            </div>


            <!--  Title input -->
            <div id="title_id" style="display:none">

                <label for="subject_title"> Course Title: </label>
                <br>
                <select name="subject_title" id="subject_title">
    
                    <option value="" disabled selected> Select your class name: </option>
    
                </select>
                <br>
            </div>

            <!-- Submit button -->
             <br><br>
            <button class="border flex center"id="submit" onclick="input(); hide()" style="display:none"> Submit </button>
 <!-- input closing div -->
        </div>
<!-- class inputs closing div -->
    </div>


<!-- Table Centeral -->
     <div class="table" style="display:none" id="miniTable">
    </div>

</div>
