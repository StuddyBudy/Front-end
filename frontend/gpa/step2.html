<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="step2.css">
    <title>Step 2</title>
</head>
<body>

    <!-- Title -->
    <div class="title">
        <h1 style="font-size: 42.5px; font-family: Georgia;"> EHS GPA Calculator </h1>
        <h4 style="font-size: 25px;"> Step 2/3 </h4>
        <h4 style="font-size: 18px;"> Next, we need you to input your assignments: </h4>
    </div>

    <hr>

    <!-- Top buttons -->
    <div style="text-align: center;">
        <a href="home.html">
            <button id="home"> Home </button>
        </a>
        <button id="help"> Help/FAQ </button>
    </div>

    <!-- Add assignment button -->
    <div style="text-align: center;">
        <button id="add_class" onclick="unhidden()" style="display: inline;"> Add assignment </button>
        <br><br>

        <!-- Clear data/storage buttons -->
        <button onclick="clearLocalStorage()"> Reset Data </button>
        <br>
        <button onclick="clearTable()"> Clear Table </button>
    </div>

    <br><br>
    <hr>

    <!-- Input Fields -->
    <div class="container">
        <div class="inputs" id="input_id" style="display:none;">
            <!-- (#1) Course input -->

            <label for="course"> Course: </label>
            <select name="courseSelect" id="courseSelect" onchange="populateCategories()"> </select>
            <br>

            <!-- (#1.2) Categoryinput -->

            <label for="category" id="categorySelectLabel"> Category: </label>
            <select name="categorySelect" id="categorySelect" > </select>

            <!-- (#1.3 Custom Weight)-->

             <label for="customWeight" id="customWeightLabel"> Custom Weight: </label>
             <input type = "number" name = "customWeight" id= "customWeight" value= "0" step="0.05" min="0" max="1"> </input>

            <!-- (#1.3 Custom Category) -->

             <label for="customCategory" id="customCategoryLabel"> Custom Category: </label>
             <input name = "custom" id="customCategory"> </input>

            <!-- Assignment input -->
            <label for="subject_title"> Assignment Name: </label>
            <input id="subject_title" type="text" placeholder="Ex: Polynomials Test, Oedipus hunt ">
            <br>

            <!-- Grade decimal input -->
        <div id="grade_cont" style="display:none">
          <label for="ass_score"> Score recieved: (in decimal form) </label>
          <input type="number" id="ass_score" name="ass_score" value="0" min="0" max="100"> 
        </div> 

          <!-- Submit button -->
          <button id="submit" onclick="input(); /*hide(); newRow()*/"> Submit </button>
        

  <!-- input closing div -->
      </div>
  <!-- container div -->      
    </div>

    
    
<!-- Table Central -->
    <div id="assignmentTables"></div>

    <br><br><br><br><br><br><br><br><br>

    <h2 style="text-align: center;"> Dev Tools </h2>
    <hr>

    <button onclick="mere()"> Display all catagories </button> <br>
    <button onclick="tables()"> Display all tables </button> <br> <br>

    <button onclick="hideCats()"> Hides all Catagories </button><br>
    <button onclick="hideTables()"> Hide all Tables </button> <br><br><br>
    
    <!-- <button onclick="storage_into_array()"> storage pasting testing lol </button> -->
    
    
    <br><br><br><br>



    <!-- JavaScript -->
    <script src="step2.js"></script>

    <!-- Previous page -->
    <hr>
    <a href="step1.html">
        <button> Previous Page </button>
    </a>
    <br><br><br><br><br><br><br><br><br>

</body>
</html>
