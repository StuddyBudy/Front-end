[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
clerk-rs = { version = "0.4.1", features = ["axum"], optional = true }
color-eyre = "0.6.4"
log = "0.4.27"
pretty_env_logger = "0.5.0"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.2", features = [
  "compression-br",
  "compression-gzip",
  "fs",
] }
tower-livereload = "0.9.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
clerk = ["dep:clerk-rs"]
